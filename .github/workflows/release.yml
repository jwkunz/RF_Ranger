name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag commit is on main
        run: |
          git fetch origin main
          TAG_COMMIT="${GITHUB_SHA}"
          MAIN_COMMIT="$(git rev-parse origin/main)"
          git merge-base --is-ancestor "$TAG_COMMIT" "$MAIN_COMMIT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Build single-file release
        run: scripts/build-release.sh "${GITHUB_REF_NAME#v}"

      - name: Compute release artifact name
        id: artifact
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          VERSION_TAG="${VERSION//./_}"
          echo "html_path=build/RF_Ranger_v${VERSION_TAG}_single_file.html" >> "$GITHUB_OUTPUT"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: rf-ranger-${{ github.ref_name }}
          path: ${{ steps.artifact.outputs.html_path }}

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.artifact.outputs.html_path }}
